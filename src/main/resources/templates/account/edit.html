<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Account - Budget Planner</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        h1 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 12px 24px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        button:hover { background: #1976D2; }
        .cancel { background: #757575; }
        .cancel:hover { background: #616161; }
        .error { color: #d32f2f; margin-top: 10px; }
        .success { color: #388e3c; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Edit Account</h1>
    <form id="editForm">
        <input type="hidden" id="accountId">
        <div class="form-group">
            <label for="accountName">Account Name *</label>
            <input type="text" id="accountName" name="accountName" required maxlength="100">
        </div>
        <div class="form-group">
            <label for="accountType">Account Type *</label>
            <select id="accountType" name="accountType" required>
                <option value="CASH">Cash</option>
                <option value="DEBIT">Debit</option>
            </select>
        </div>
        <div class="form-group">
            <label for="accountCurrency">Currency *</label>
            <input type="text" id="accountCurrency" required maxlength="3">
        </div>
        <div class="form-group">
            <label for="accountDescription">Description</label>
            <textarea id="accountDescription" maxlength="500" rows="3"></textarea>
        </div>
        <button type="submit">Save Changes</button>
        <button type="button" class="cancel" onclick="location.href='/accounts'">Cancel</button>
    </form>
    <div id="message"></div>
    <script>
    const pathParts = window.location.pathname.split('/');
    const accountId = pathParts[pathParts.length - 2];
    document.getElementById('accountId').value = accountId;
    </script>
    <script th:src="@{/js/account-edit.js}"></script>
</body>
</html>
