# Server Configuration
server.port=8080

# Application Name
spring.application.name=colossus-engine

# Database Configuration - PostgreSQL colossus_database
spring.datasource.url=jdbc:postgresql://localhost:5432/colossus_database
spring.datasource.username=colossus_user_1
spring.datasource.password=colossus1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/ddl
spring.flyway.baseline-on-migrate=true

# Logging Configuration
logging.level.id.colossus=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO

# Development CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Content-Type,Authorization
cors.max-age=3600

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true